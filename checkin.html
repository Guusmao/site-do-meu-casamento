<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in — Casamento Sarah & Felipe</title>
<meta name="robots" content="noindex, nofollow">
<style>
    :root {
        --bg: #1e1c19;
        --card: #2a2621;
        --accent: #f2c14e;
        --text: #f3efe9;
        --muted: #b7ada0;
        --danger: #d84a4a;
        --success: #4caf7d;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 4px; text-align:center; }
    p.sub { color: var(--muted); font-size: 0.85rem; margin-top: 0; text-align:center; }

    .card {
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        max-width: 420px;
        width: 100%;
        margin-top: 16px;
    }
    input, button {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #46403a;
        background: #1e1c19;
        color: var(--text);
        font-size: 1rem;
        margin-bottom: 12px;
    }
    button {
        background: var(--accent);
        color: #1e1c19;
        font-weight: 600;
        border: none;
        cursor: pointer;
    }
    button:active { opacity: 0.85; }

    #reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
    }

    .resultado {
        margin-top: 16px;
    }
    .resultado h2 { font-size: 1rem; margin-bottom: 10px; }
    .nome-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e1c19;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
    }
    .nome-item button {
        width: auto;
        padding: 8px 14px;
        margin: 0;
        font-size: 0.85rem;
    }
    .nome-item.entrou { opacity: 0.5; }
    .tag-entrou {
        font-size: 0.75rem;
        color: var(--success);
    }
    .msg-erro {
        background: rgba(216,74,74,0.15);
        color: #ff9d9d;
        padding: 12px;
        border-radius: 10px;
        font-size: 0.9rem;
        margin-top: 12px;
    }
    .msg-ok {
        background: rgba(76,175,125,0.15);
        color: #8fe0b6;
        padding: 12px;
        border-radius: 10px;
        font-size: 0.9rem;
        margin-top: 12px;
    }
    .hidden { display: none; }
</style>
</head>
<body>

<h1>Check-in — Sarah & Felipe</h1>
<p class="sub">Página exclusiva da equipe da entrada</p>

<!-- Tela de senha -->
<div class="card" id="telaSenha">
    <input type="password" id="senhaInput" placeholder="Senha da portaria">
    <button id="btnEntrar">Entrar</button>
    <div id="senhaErro" class="msg-erro hidden"></div>
</div>

<!-- Tela do leitor -->
<div class="card hidden" id="telaLeitor">
    <div id="reader"></div>
    <button id="btnNovaLeitura" style="margin-top:12px;">Ler novo QR Code</button>
    <div id="areaResultado" class="resultado"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/checkin.js"></script>
</body>
</html>
